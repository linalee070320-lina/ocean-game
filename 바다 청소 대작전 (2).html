<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바다 청소 대작전</title>
<style>
:root{--bg:#d9f1ff;--fg:#0b2a45;--card:#fff;--sea:#7cc8f0;--btn:#0a7cc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2236;--fg:#e6f4ff;--card:#14354f;--sea:#14527a;--btn:#2b9be0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;text-align:center}
h1{font-size:1.5rem;margin:12px 8px 4px}
#bar{display:flex;justify-content:space-around;font-size:1.2rem;font-weight:700;padding:6px}
#sea{position:relative;height:58vh;min-height:300px;margin:0 8px;border-radius:16px;overflow:hidden;background:linear-gradient(#bfeaff 0%,#4fb3e8 22%,#1c78b8 62%,#0d3f73 100%);user-select:none;touch-action:manipulation}
.it{z-index:2;position:absolute;top:-60px;font-size:2.8rem;cursor:pointer;animation:fall linear forwards;line-height:1}
@keyframes fall{to{top:100%}}
#sea::before{content:"🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊";position:absolute;top:-6px;left:0;right:0;height:30px;white-space:nowrap;overflow:hidden;font-size:1.6rem;z-index:3;pointer-events:none}
#sea::after{content:"🪸 🌿 🐚 🌿 🪸 🌿 🪨 🌿 🪸 🌿";position:absolute;bottom:0;left:0;right:0;height:44px;padding-top:8px;white-space:nowrap;overflow:hidden;font-size:1.6rem;background:linear-gradient(#e6c98a,#c9a15c);z-index:3;pointer-events:none}
.b{position:absolute;bottom:40px;width:10px;height:10px;border:2px solid #ffffffaa;border-radius:50%;animation:rise 6s linear infinite;pointer-events:none}
@keyframes rise{to{bottom:100%;opacity:0}}
#sea::before{content:"";font-size:0;top:0;height:12px;background:radial-gradient(circle at 50% 100%,#e8f8ff 0 7px,transparent 8px) 0 0/22px 12px repeat-x}
#sea::after{content:"";font-size:0;height:34px;padding:0;background:radial-gradient(circle at 15% 40%,#a8793c 0 5px,transparent 6px),radial-gradient(circle at 62% 55%,#a8793c 0 7px,transparent 8px),radial-gradient(circle at 88% 35%,#a8793c 0 4px,transparent 5px),linear-gradient(#e6c98a,#c9a15c)}
.gl{filter:drop-shadow(0 0 8px gold)}
.oil{position:absolute;z-index:1;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle,#050505 40%,#050505d0 62%,transparent 72%);display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;animation:grow 10s linear forwards}
@keyframes grow{from{transform:scale(.6)}to{transform:scale(2.4)}}
.oa{filter:brightness(.2) drop-shadow(0 0 4px #888)}
#msg{min-height:3.2em;margin:8px 12px;font-size:1.05rem}
.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow:auto;background:var(--card);padding:16px;gap:10px;z-index:5}
button{font:inherit;font-size:1.2rem;padding:10px 24px;border:0;border-radius:24px;background:var(--btn);color:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>🌊 바다 청소 대작전</h1>
<div id="bar"><span>⏱ <b id="t">45</b></span><span>♻️ <b id="s">0</b></span><span>🏆 <b id="h">0</b></span><span id="l">❤️❤️❤️</span></div>
<div id="sea"><i class="b" style="left:8%"></i><i class="b" style="left:27%;animation-delay:2s"></i><i class="b" style="left:51%;animation-delay:4s"></i><i class="b" style="left:73%;animation-delay:1s"></i><i class="b" style="left:90%;animation-delay:3s"></i>
<div class="box" id="start">
<div>쓰레기(🧋🛍️🥫)는 <b>클릭!</b><br>바다 친구들(🐢🐟🐙)은 <b>건드리지 마요!</b></div>
<div style="font-size:.95rem">🧲 자석: 쓰레기 한꺼번에 · ⏰ 시간 +5초<br>🛢️ 큰 쓰레기는 3번 눌러요 · 연속으로 주우면 🔥콤보 점수!<br>🚨 기름이 퍼지면 검은 얼룩을 눌러 닦고, 기름 묻은 동물을 구해요!</div><button onclick="go()">시작하기</button>
</div>
</div>
<div id="msg">쓰레기를 주울 때마다 알아두면 좋은 이야기가 나와요.</div>
<script>
var T=[["🧋","일회용 플라스틱 컵은 분해되는 데 수백 년이 걸려요. 텀블러를 써요!"],["🛍️","비닐봉지를 삼킨 거북이가 많아요. 장바구니를 써요!"],["🥫","캔은 분리배출하면 다시 쓸 수 있어요."],["🍼","플라스틱 병은 깨끗이 씻어 분리배출해요."],["🧴","작은 플라스틱은 잘게 부서져 미세플라스틱이 돼요."],["🎣","버려진 그물과 낚싯줄에 동물들이 걸려요."],["🥡","배달 용기는 헹궈서 분리배출해요."]],
A=["🐢","🐟","🐙","🐬","🦀","🐠"],
sc,t,life,on,iv,tm,combo=0,mx=0,hi=0;try{hi=+localStorage.getItem("oc_hi")||0}catch(e){}
function $(i){return document.getElementById(i)}
function go(){
sc=0;combo=0;mx=0;ev=0;t=45;life=3;on=1;
$("start").style.display="none";
document.querySelectorAll(".it,.oil").forEach(function(e){e.remove()});
hud();
iv=setInterval(spawn,750);
tm=setInterval(function(){t--;hud();if(t<=25&&!ev){ev=1;oil()}if(t<=0)end()},1000);
}
function hud(){$("t").textContent=t;$("s").textContent=sc;$("h").textContent=hi;$("l").textContent="❤️".repeat(life)+"🖤".repeat(3-life)}
function spawn(){
var r=Math.random(),bad=r<.28,sp=!bad&&r<.36,big=!bad&&!sp&&r<.44,d=document.createElement("div"),f,hp=3;
d.className="it"+(bad||sp||big?"":" tr");
if(bad){d.textContent=A[Math.floor(Math.random()*A.length)]}
else if(sp){var k=Math.random()<.5;d.textContent=k?"🧲":"⏰";f=k?"M":"C";d.classList.add("gl")}
else if(big){d.textContent="🛢️";f=["","큰 쓰레기는 여러 번 눌러야 해요!"];d.style.fontSize="4.2rem"}
else{f=T[Math.floor(Math.random()*T.length)];d.textContent=f[0]}
d.style.left=Math.random()*82+"%";
d.style.animationDuration=Math.max(2,4+Math.random()*3-(45-t)/15)+"s";
d.onclick=function(){
if(!on)return;
if(big&&--hp>0){$("msg").textContent="💥 "+hp+"번 더!";return}
d.remove();
if(bad){life--;combo=0;$("msg").textContent="앗! 바다 친구를 건드렸어요. 조심조심!";hud();if(life<=0)end()}
else if(sp){if(f=="M"){document.querySelectorAll(".it.tr").forEach(function(e){e.click()});$("msg").textContent="🧲 자석! 쓰레기가 모두 끌려왔어요!"}else{t+=5;$("msg").textContent="⏰ 시간 +5초!"}hud()}
else{combo++;mx=Math.max(mx,combo);var g=10*(1+Math.min(4,Math.floor(combo/5)))*(big?3:1);sc+=g;$("msg").textContent="👍 +"+g+(combo>=5?" 🔥콤보 "+combo:"")+" "+f[1];hud()}
};
d.onanimationend=function(){if(!bad&&!sp&&on)combo=0;d.remove()};
$("sea").appendChild(d);
}
var op=0,ev=0;
function oil(){
op=0;$("msg").textContent="🚨 기름유출 발생! 검은 얼룩을 여러 번 눌러 닦아요!";
for(var i=0;i<3;i++)blob(i);
for(i=0;i<3;i++)setTimeout(oa,2500+i*3500);
}
function blob(i){
var o=document.createElement("div"),h=3;
o.className="oil";o.textContent="🧽";
o.style.left=(18+i*32+Math.random()*8)+"%";o.style.top=(22+Math.random()*28)+"%";
o.onclick=function(){
if(!on)return;
h--;
if(h>0){o.style.opacity=.3+h*.23;return}
o.remove();sc+=30;$("msg").textContent="🧽 얼룩이 깨끗해졌어요! +30";hud();
};
o.onanimationend=function(){
o.remove();
if(on&&!op){op=1;life--;$("msg").textContent="기름이 번져 바다 친구들이 힘들어해요 💔";hud();if(life<=0)end()}
};
$("sea").appendChild(o);
}
function oa(){
if(!on)return;
var d=document.createElement("div");
d.className="it oa";d.textContent=["🐢","🐧","🐟"][Math.floor(Math.random()*3)];
d.style.left=Math.random()*82+"%";d.style.animationDuration="6s";
d.onclick=function(){if(!on)return;d.remove();sc+=50;$("msg").textContent="🧼 기름을 닦아 줬어요! +50";hud()};
d.onanimationend=function(){d.remove()};
$("sea").appendChild(d);
}
var Q=[
['SDGs(지속가능발전목표)에서 바다와 바닷속 생물을 보호하는 목표는 몇 번일까요?',['8번','14번','17번'],1,'14번째 목표가 해양생태계 보호예요. SDGs는 모두 17가지 목표예요.'],
['바다에 버려진 플라스틱 쓰레기는 어떻게 될까요?',['금방 사라져요','작은 조각으로 부서져 오래 남아요','바닷물에 녹아 없어져요'],1,'플라스틱은 자연에서 쉽게 사라지지 않고 작은 조각으로 부서져 오랫동안 바다에 남을 수 있어요.'],
['우리가 버린 쓰레기가 바다까지 갈 수 있는 길이 아닌 것은?',['바람','빗물과 하천','엘리베이터'],2,'쓰레기는 바람과 빗물, 하천을 따라 바다로 흘러갈 수 있어요.'],
['바다 동물이 쓰레기 때문에 겪는 일은?',['먹이로 착각해 삼키거나 폐그물에 걸려요','쓰레기가 먹이를 만들어 줘요','쓰레기 덕분에 더 튼튼해져요'],0,'해양생물이 쓰레기를 먹이로 착각해 삼키거나 폐그물에 걸리면 다치거나 죽을 수도 있어요.'],
['바닷가에 놀러 갔을 때 쓰레기는 어떻게 해야 할까요?',['모래에 묻어요','가져온 쓰레기를 되가져와요','바다에 던져요'],1,'자신이 가져온 쓰레기를 되가져오는 습관을 길러요. 가족, 친구와 해변 정화 활동에 참여해도 좋아요.'],
['바다에 기름이 유출되면 어떻게 될까요?',['기름이 바로 사라져요','넓은 바다 위로 기름막이 빠르게 퍼져요','바다가 더 깨끗해져요'],1,'기름은 물 위에 넓게 퍼져 해양생물과 바닷가 생태계에 피해를 줄 수 있어요.'],
['기름이 깃털에 묻은 바닷새가 힘들어하는 이유는?',['방수 기능이 약해져 체온을 지키기 어려워요','더 높이 날 수 있어요','깃털이 더 예뻐져요'],0,'깃털에 기름이 묻으면 방수 기능이 약해져 체온을 유지하기 어려워져요.'],
['기름이 넓게 퍼지는 것을 막을 때 쓰는 전문 장비는?',['오일펜스','우산','장바구니'],0,'사고가 나면 오일펜스 등 전문 장비로 퍼짐을 막고 신속하게 수거해요.']
],qi,qs;
function quiz(){qi=0;qs=0;qn()}
function qn(){
var b=document.createElement('div');b.className='box';
if(qi>=Q.length){
b.innerHTML='<h2>'+(qs>=7?'🏆 바다 박사!':qs>=5?'🌟 바다 지킴이!':'🙂 한 번 더 도전!')+'</h2><div>퀴즈 점수: <b>'+qs+' / '+Q.length+'</b></div><div>게임 점수: <b>'+sc+'점</b> · 최고기록 🏆 '+hi+'점</div><button>게임 다시 하기</button>';
b.querySelector('button').onclick=function(){b.remove();go()};
$('sea').appendChild(b);return}
var q=Q[qi],o=q[1].map(function(x,i){return{x:x,c:i==q[2]}}).sort(function(){return Math.random()-.5}),cs=[];
b.innerHTML='<div>문제 '+(qi+1)+' / '+Q.length+'</div><h3 style=margin:0>'+q[0]+'</h3>';
o.forEach(function(e){
var c=document.createElement('button');c.textContent=e.x;c.style.fontSize='1rem';cs.push(c);
c.onclick=function(){
if(b.dn)return;b.dn=1;
if(e.c)qs++;
cs.forEach(function(z,j){if(o[j].c)z.style.background='#2a9d4b'});
if(!e.c)c.style.background='#d64545';
var f=document.createElement('div');
f.textContent=(e.c?'⭕ 정답! ':'❌ 아쉬워요! ')+q[3];
var n=document.createElement('button');
n.textContent=qi>=Q.length-1?'결과 보기':'다음 ▶';
n.onclick=function(){b.remove();qi++;qn()};
b.appendChild(f);b.appendChild(n);
};
b.appendChild(c);
});
$('sea').appendChild(b);
}
function end(){
on=0;clearInterval(iv);clearInterval(tm);var nr=sc>hi;if(nr){hi=sc;try{localStorage.setItem("oc_hi",hi)}catch(e){}}hud();
var b=document.createElement("div");b.className="box";
b.innerHTML="<h2>"+(nr?"🎉 새 최고기록! ":"")+(sc>=400?"🏆 바다 지킴이!":sc>=200?"🌟 멋진 청소부!":"🙂 좋은 시작!")+"</h2><div>내 점수: <b>"+sc+"점</b> · 최고 콤보 🔥"+mx+"</div><div>🏆 최고기록: <b>"+hi+"점</b></div><button class='qb'>📝 퀴즈 풀기</button><div style=\"text-align:left;max-width:520px;line-height:1.55\"><b>우리도 할 수 있어요!</b><br>🧋 <b>텀블러·장바구니 쓰기</b>: 일회용 컵과 비닐봉지를 줄이면 바다로 가는 쓰레기가 줄어요.<br>♻️ <b>분리배출</b>: 내용물을 비우고 헹궈서 종류별로 버리면 다시 쓸 수 있어요.<br>🏖️ <b>줍깅(줍기+조깅)</b>: 해변이나 동네 길에서 쓰레기를 주워요. 장갑과 집게, 봉투를 챙겨요.<br>🛍️ <b>포장 줄이기</b>: 꼭 필요한 것만 사고, 배달 용기는 헹궈서 버려요.<br>📣 <b>알리기</b>: 오늘 배운 것을 가족과 친구에게 이야기해요.<br>🚨 <b>기름유출 대처</b>: 기름은 물에 섞이지 않고 넓게 퍼져서 치우기 어려워요. 어른과 전문가가 오일펜스·흡착포로 막고 닦고, 2007년 태안에서는 백만 명이 넘는 자원봉사자가 도왔어요. 기름을 발견하면 직접 만지지 말고 어른께 알려요.<br>🛡️ <b>안전</b>: 깨진 유리나 날카로운 쓰레기는 만지지 말고 어른께 알려요.</div><button class='rb'>다시 하기</button>";
b.querySelector('.rb').onclick=function(){b.remove();go()};b.querySelector('.qb').onclick=function(){b.remove();quiz()};
$("sea").appendChild(b);
}
$("h").textContent=hi;
</script>
</body>
</html>
